render.history=async()=>{let d=await rows('club_history','event_date',false);main.innerHTML=head('היסטוריה','newHistory()')+`<div class="panel">${table(d,[['תאריך','event_date'],['מועדון',x=>clubName(x.club_id)],['כותרת','title']],x=>`<button class="ghost" onclick='editHistory(${JSON.stringify(x)})'>עריכה</button><button class="danger" onclick="del('club_history','${x.id}','${x.club_id}')">מחיקה</button>`)}</div>`};
window.newHistory=()=>editHistory({club_id:cf()||clubs[0]?.id});window.editHistory=x=>modal(x.id?'עריכת אירוע':'אירוע היסטורי',clubSelect(x.club_id)+input('event_date','תאריך','date',x.event_date)+input('title','כותרת','text',x.title)+`<label>תוכן<textarea class="field" name="body" rows="5">${esc(x.body||'')}</textarea></label>`+input('image_url','תמונה URL','url',x.image_url),async f=>save('club_history',f,x.id,f.club_id));
render.moderation=async()=>{let d=await rows('moderation_cases','created_at',false);main.innerHTML=head('מודרציה')+`<div class="panel">${table(d,[['סיבה','reason'],['מועדון',x=>clubName(x.club_id)],['Confidence','ai_confidence'],['סטטוס','status'],['נוצר','created_at']],x=>`<button class="ghost" onclick='editCase(${JSON.stringify(x)})'>טיפול</button>`)}</div>`};
window.editCase=x=>modal('טיפול בתיק',select('status','סטטוס',[['open','Open'],['false_positive','False Positive'],['warning','Warning'],['resolved','Resolved'],['banned','Banned']],x.status)+`<label>הערת מודרטור<textarea class="field" name="moderator_note">${esc(x.moderator_note||'')}</textarea></label>`,async f=>{f.moderator_id=me.user_id;f.resolved_at=f.status==='open'?null:new Date().toISOString();let r=await db.from('moderation_cases').update(f).eq('id',x.id);if(r.error)throw r.error;await db.rpc('write_audit',{p_action:'moderation.resolve',p_entity_type:'moderation_cases',p_entity_id:x.id,p_club_id:x.club_id,p_before:x,p_after:f})});
render.users=async()=>{let r=await db.rpc('admin_users');if(r.error)throw r.error;main.innerHTML=head('משתמשים')+`<div class="panel">${table(r.data,[['שם','display_name'],['@','username'],['מועדון',x=>clubName(x.favorite_club_id)],['Role','role_name'],['נוצר','created_at']],x=>`<button class="ghost" onclick='makeStaff(${JSON.stringify(x)})'>Staff</button>`)}</div>`};
window.makeStaff=async x=>{let rr=await db.from('roles').select('key,name_he').order('name_he');modal('Staff — '+(x.display_name||x.username),select('role_key','Role',(rr.data||[]).map(r=>[r.key,r.name_he]),x.role_key||'moderator')+select('approval_level','Approval Level',[[1,'1 Contributor'],[2,'2 Editor'],[3,'3 Publisher'],[4,'4 Manager']],x.approval_level||1)+input('badge','Public Badge','text',x.public_badge||'')+`<label>Club scopes<select class="field" name="clubs" multiple size="8">${clubs.map(c=>`<option value="${c.id}">${esc(c.name_he)}</option>`).join('')}</select></label>`,async f=>{let club_ids=[...form.querySelector('[name=clubs]').selectedOptions].map(o=>o.value);let r=await db.rpc('admin_set_staff',{p_user_id:x.user_id,p_role_key:f.role_key,p_approval_level:+f.approval_level,p_badge:f.badge||null,p_club_ids:club_ids});if(r.error)throw r.error})};
render.staff=async()=>{let r=await db.rpc('admin_users');if(r.error)throw r.error;let d=(r.data||[]).filter(x=>x.role_key);main.innerHTML=head('Staff / Roles')+`<div class="panel">${table(d,[['שם','display_name'],['@','username'],['Role','role_name'],['Level','approval_level'],['Badge','public_badge'],['מושעה',x=>x.suspended_at?'כן':'לא']],x=>`<button class="ghost" onclick='makeStaff(${JSON.stringify(x)})'>עריכה</button>`)}</div>`};
render.audit=async()=>{let r=await db.from('audit_log').select('*').order('created_at',{ascending:false}).limit(300);if(r.error)throw r.error;main.innerHTML=head('Audit Log')+`<div class="panel">${table(r.data,[['פעולה','action'],['ישות','entity_type'],['מזהה','entity_id'],['מועדון',x=>clubName(x.club_id)],['מועד','created_at']])}</div>`};
boot();
</script></body></html>
